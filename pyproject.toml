[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "greggand-data_mix_curriculum_count_trace"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出OCR 文档理解工程师·训练数据配比与课程学习上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "greggand" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://greggand.github.io"
Repository = "https://github.com/greggand/data_mix_curriculum_count_trace"
Issues = "https://github.com/greggand/data_mix_curriculum_count_trace/issues"

[project.scripts]
data_mix_curriculum_count_trace = "data_mix_curriculum_count_trace:main"

[tool.setuptools]
py-modules = ["data_mix_curriculum_count_trace"]
